name: Deploy site to GitHub Pages

# Publishes the ProxyFlow AI landing page as a live static website on every push.
# Live URL after the first successful run: https://<owner>.github.io/<repo>/

on:
  push:
    branches: ["claude/gallant-einstein-kkwa3d"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (source: GitHub Actions) if it isn't already.
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          # base_path is GitHub-derived (correct repo casing), so assets resolve.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Disable Jekyll (serve _next/ assets verbatim)
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "out"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
